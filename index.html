    <link rel="canonical" href="https://disasterlens.leixue.dev/" />
    <meta property="og:url" content="https://disasterlens.leixue.dev/" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="DisasterLens — FEMA Disaster Data &amp; NWS Alerts Dashboard" />
